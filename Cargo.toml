[package]
name = "kakaotalk-launcher"
version = "0.1.0"
edition = "2024"
description = "KakaoTalk (Windows) launcher for Ubuntu using Proton via umu"
license = "MIT"
repository = "https://github.com/buuung/Ubuntu-Kakaotalk"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_10"] }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[[bin]]
name = "kakaotalk-proton"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
